[tool.poetry]
name = "rpi-usb-sim"
version = "1.2.2"
description = "Raspberry Pi USB device simulator runtime"
authors = ["Xiaochuan Lu <xiaochuan.lu@yahoo.com>"]

packages = [
    { include = "src" },
    { include = "scripts" },
    { include = "config" },
]

[tool.poetry.dependencies]
python = ">=3.10.6,<3.12"

[tool.poetry.scripts]
usbsim-gui = "scripts.mount_app:main"
usbsim-robot = "scripts.mount_robot:main"
usbsim-setup = "scripts.setup:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
