[project]
name = "raspi-usb-sim-testcases"
version = "0.1.0"
description = "Robot Framework test cases for raspi-usb-sim"
requires-python = ">=3.10,<3.13"
dependencies = [
    "robotframework>=7.0,<8.0",
    "robotframework-sshlibrary>=3.8,<4.0",
]

[tool.poetry]
package-mode = false

[tool.robot]
paths = ["resource"]
output-dir = "results"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
